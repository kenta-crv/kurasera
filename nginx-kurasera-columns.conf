# kurasera.life — /columns → drafity housekeeping
# パンくず: トップ → 家事代行LP(/housekeeping) → 家事代行記事一覧 → 記事

location ^~ /columns {
    proxy_set_header Host drafity.pro;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ★ 親LPのURLのみ（日本語ヘッダー禁止）
    proxy_set_header X-Brand-Lp-Path /housekeeping;

    proxy_set_header Accept-Encoding "";
    proxy_pass https://drafity.pro/housekeeping/columns;
    proxy_ssl_server_name on;
    proxy_redirect off;
    proxy_read_timeout 90;

    sub_filter_types text/html text/css application/javascript;
    sub_filter 'https://drafity.pro' 'https://kurasera.life';
    sub_filter 'http://drafity.pro' 'https://kurasera.life';
    sub_filter '/assets_ok/' '/remote-assets/';
    sub_filter '/assets/' '/remote-assets/';
    sub_filter '/housekeeping/columns' '/columns';
    sub_filter_once off;
    proxy_cookie_domain drafity.pro kurasera.life;
}
